name: Feature request
description: Suggest a new signature, verdict rule, output format, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the analysis situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like findcrypt to do?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: >
        For a new signature: the constant's bytes (hex), its size, the
        standard it comes from (FIPS, RFC, national spec), and where it
        appears in a real binary. For anything else, a shell session
        showing the behavior you want.
      render: shell
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to work on this myself
